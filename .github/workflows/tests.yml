name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Component tests
        run: >-
          npm run cy:component --
          --reporter junit
          --reporter-options "mochaFile=cypress/results/component-${{ github.sha }}.xml"

      - name: UI tests
        run: |
          npm run start:web &
          npx --yes wait-on http://localhost:5173
          npm run cy:ui -- --reporter junit --reporter-options "mochaFile=cypress/results/ui-${{ github.sha }}.xml"

      - name: Upload Cypress JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: web/cypress/results
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          if-no-files-found: ignore

  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Use the local practice env
        run: cp .env.example .env

      # CI=true (set by GitHub Actions) enables the visual project in playwright.config.ts.
      # Do not pass --update-snapshots here — baselines refresh only via visual-baselines.yml.
      - name: Playwright tests (API, E2E, a11y, visual)
        run: npm run test:pw

      - name: Guard against accidental baseline writes
        if: ${{ always() }}
        run: |
          if git status --porcelain tests/visual | grep -q .; then
            echo "::error::Playwright changed files under tests/visual during CI."
            echo "Approved Linux baselines must not be updated in the tests workflow."
            echo "Use the Visual baselines workflow_dispatch job to refresh baselines."
            git status --porcelain tests/visual
            exit 1
          fi

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            reports/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload visual diffs and Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report
          retention-days: 30
          if-no-files-found: ignore

  report:
    needs: [cypress, playwright]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: qa-report
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Playwright reports
        uses: actions/download-artifact@v4
        with:
          name: playwright-reports
          path: .
        continue-on-error: true

      - name: Download Cypress JUnit results
        uses: actions/download-artifact@v4
        with:
          name: cypress-results
          path: web/cypress/results
        continue-on-error: true

      - name: Download accessibility report
        uses: actions/download-artifact@v4
        with:
          name: a11y-report
          path: a11y-report
        continue-on-error: true

      - name: Build QA report
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/qa-report.mjs build

      - name: Publish QA report
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa-report.mjs publish

      - name: Build pipeline metrics
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa-metrics.mjs build

      - name: Publish pipeline metrics comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa-metrics.mjs publish

      - name: Upload QA report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-report
          retention-days: 90

      - name: Upload QA metrics doc
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-metrics-doc
          path: docs/QA-METRICS.md
          retention-days: 90
          if-no-files-found: ignore
